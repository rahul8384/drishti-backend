<!DOCTYPE html>
<html>
<head>
    <title>Project Sanjay - Threat Intelligence Graph</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #51CF66;
        }
        
        #graph-container {
            width: 100%;
            height: 800px;
            background: #2d2d2d;
            border: 2px solid #51CF66;
            border-radius: 8px;
            overflow: hidden;
        }
        
        svg {
            width: 100%;
            height: 100%;
        }
        
        .node {
            cursor: pointer;
            stroke: #fff;
            stroke-width: 2px;
        }
        
        .node:hover {
            stroke-width: 4px;
        }
        
        .link {
            stroke: #666;
            stroke-width: 2px;
            opacity: 0.6;
        }
        
        .label {
            font-size: 12px;
            fill: #fff;
            text-anchor: middle;
            pointer-events: none;
        }
        
        .legend {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(45, 45, 45, 0.9);
            border: 2px solid #51CF66;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .legend-item {
            margin: 8px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .legend-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }
        
        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: #51CF66;
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
            display: none;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>🎯 Project Sanjay - Threat Intelligence Graph</h1>
    
    <div id="graph-container"></div>
    
    <div class="legend">
        <strong>Legend</strong>
        <div class="legend-item">
            <div class="legend-dot" style="background: #FF6B6B;"></div>
            <span>Incident</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background: #51CF66;"></div>
            <span>Location</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background: #4C6EF5;"></div>
            <span>Terrorist Group</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background: #FFA94D;"></div>
            <span>Weapon</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background: #A78BFA;"></div>
            <span>Other</span>
        </div>
    </div>
    
    <div class="tooltip" id="tooltip"></div>
    
    <script>
        // Fetch graph data from Spring Boot
        fetch('/api/v1/intel/graph')
            .then(response => response.json())
            .then(data => {
                console.log('Graph data:', data);
                renderGraph(data);
            })
            .catch(error => console.error('Error:', error));
        
        function renderGraph(data) {
            const container = document.getElementById('graph-container');
            const width = container.clientWidth;
            const height = container.clientHeight;
            
            // Create SVG
            const svg = d3.select('#graph-container')
                .append('svg')
                .attr('width', width)
                .attr('height', height);
            
            // Create force simulation
            const simulation = d3.forceSimulation(data.nodes)
                .force('link', d3.forceLink(data.links)
                    .id(d => d.id)
                    .distance(100))
                .force('charge', d3.forceManyBody().strength(-300))
                .force('center', d3.forceCenter(width / 2, height / 2));
            
            // Create links
            const link = svg.selectAll('.link')
                .data(data.links)
                .enter()
                .append('line')
                .attr('class', 'link');
            
            // Create nodes
            const node = svg.selectAll('.node')
                .data(data.nodes)
                .enter()
                .append('circle')
                .attr('class', 'node')
                .attr('r', d => d.size || 20)
                .attr('fill', d => d.color || '#999')
                .call(d3.drag()
                    .on('start', dragStarted)
                    .on('drag', dragged)
                    .on('end', dragEnded));
            
            // Add labels
            const label = svg.selectAll('.label')
                .data(data.nodes)
                .enter()
                .append('text')
                .attr('class', 'label')
                .text(d => d.id.substring(0, 10)); // Truncate long IDs
            
            // Tooltip on hover
            node.on('mouseover', function(event, d) {
                const tooltip = document.getElementById('tooltip');
                tooltip.style.display = 'block';
                tooltip.style.left = (event.pageX + 10) + 'px';
                tooltip.style.top = (event.pageY + 10) + 'px';
                
                let content = `<strong>${d.id}</strong><br/>Type: ${d.type}`;
                if (d.metadata) {
                    content += `<br/>Location: ${d.metadata.location}`;
                    content += `<br/>Date: ${d.metadata.date}`;
                    content += `<br/>Casualties: ${d.metadata.casualties}`;
                }
                tooltip.innerHTML = content;
            })
            .on('mouseout', function() {
                document.getElementById('tooltip').style.display = 'none';
            });
            
            // Update positions on simulation tick
            simulation.on('tick', () => {
                link
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);
                
                node
                    .attr('cx', d => d.x)
                    .attr('cy', d => d.y);
                
                label
                    .attr('x', d => d.x)
                    .attr('y', d => d.y + 5);
            });
            
            // Drag functions
            function dragStarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }
            
            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }
            
            function dragEnded(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }
        }
    </script>
</body>
</html>
