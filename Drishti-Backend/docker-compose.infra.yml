version: '3.8'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: drishti
      POSTGRES_USER: drishti
      POSTGRES_PASSWORD: drishti123
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/drishti123
    ports: ['7474:7474', '7687:7687']
    volumes: ['neo4jdata:/data']

volumes:
  pgdata:
  neo4jdata: